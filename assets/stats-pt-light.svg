<title id="title">Atividade pública de João Montagner no GitHub</title>
<desc id="desc">15 repositórios públicos, 4 atualizados nos últimos 90 dias, conta criada em 2023. Linguagem principal por repositório: Python 4, C 1, HTML 1. Dados da API pública do GitHub em 10/11/2026.</desc>
<rect width="960" height="270" rx="16" fill="#f3eee5"/>
<g font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace" fill="#14212c">

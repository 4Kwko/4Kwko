<text x="920" y="48" text-anchor="end" fill="#4d5b68" font-size="18">Atualizado em 10/11/2026</text>
<text x="40" y="112" font-size="46" font-weight="700">15</text>
<text x="40" y="142" fill="#4d5b68" font-size="19">repositórios públicos</text>
